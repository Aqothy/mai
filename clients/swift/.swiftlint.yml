included:
  - mai
  - maiTests

excluded:
  - mai/Generated

disabled_rules:
  # Formatting handled by .swift-format / Swift 6 idioms.
  - closure_parameter_position
  - line_length
  - multiple_closures_with_trailing_closure
  - opening_brace
  - trailing_comma
  # Structural metrics produce noise on SwiftUI views and layout engines.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - large_tuple
  - nesting
  # Deliberate project patterns: non-failable String(decoding:as:) for valid UTF-8
  # and explicit NotificationCenter observer removal in view lifecycle / tearDown.
  - notification_center_detachment
  - optional_data_string_conversion
  - type_body_length

opt_in_rules:
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - direct_return
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - last_where
  - legacy_multiple
  - overridden_super_call
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - shorthand_optional_binding
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

identifier_name:
  min_length:
    warning: 1
    error: 1

type_name:
  excluded:
    - ID

trailing_whitespace:
  ignores_empty_lines: true

redundant_discardable_let:
  ignore_swiftui_view_bodies: true
